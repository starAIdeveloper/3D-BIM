[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "desktop-3d-bim"
version = "1.0.0"
description = "Native Qt architectural concept editor"
requires-python = ">=3.11"
dependencies = ["PySide6==6.10.1"]

[project.optional-dependencies]
test = ["pytest==9.1.1"]

[project.scripts]
bim-desktop = "bim.app:main"

[tool.setuptools]
packages = ["bim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
